# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy .NET isolated Functions - ice-relay-func

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_to_azure:
        description: Confirm the Function App plan supports .NET 10 before deploying
        required: true
        type: boolean
        default: false

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '/api' # set this to the path to your web app project, defaults to the repository root
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v5

      - name: Setup .NET ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish Functions app
        shell: bash
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          dotnet publish --configuration Release --output ./publish
          popd
      
      - name: Login to Azure
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_to_azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3FA8A37468454BADB1BFFBFD62E73BC8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BFD5015F5FE547D7820BB009AEFC8844 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_86B2964EAFEA46D0B158BAC7D74E1D8C }}

      - name: 'Run Azure Functions Action'
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_to_azure
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'ice-relay-func'
          slot-name: 'Production'
          package: './api/publish'
          